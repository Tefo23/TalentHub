{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}
{% load static %}
  <div class="container-xxl py-5">
            <div class="container">
              
                <div class="row g-4">
				<div class="col-md-6">
				<div class="col-lg-12 col-sm-6 wow fadeInUp" data-wow-delay="0.3s">
                       <img src="{% static 'img/carousel-2.jpg' %}" style="width:100%;"></img>
                    </div> 
					</div>
					<div class="col-md-6">
					  <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s">Create {{ role }} Account</h1>
                 <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary w-100">

                        Create Account

                    </button>

                </form>     
					</div> 
					
                   
                </div>
            </div>
        </div>



{% endblock %}
