services:
  - type: web
    name: talenthub
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn talenthub.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: talenthub-db
          property: connectionString

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

databases:
  - name: talenthub-db
    databaseName: talenthub
    user: talenthub